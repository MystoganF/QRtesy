server:
  port: 8080

spring:
  application:
    name: qrtesy-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: qrtesy
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: qrtesy
    default-schema: qrtesy
    locations: classpath:db/migration
    create-schemas: true

app:
  timezone: Asia/Manila
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 12
    cookie-name: qrtesy_staff_token
    cookie-secure: ${COOKIE_SECURE:false}
  seed:
    staff-name: ${SEED_STAFF_NAME:Event Organizer}
    staff-username: ${SEED_STAFF_USERNAME:staff}
    staff-password: ${SEED_STAFF_PASSWORD:ChangeMe123!}