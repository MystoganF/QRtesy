server:
  port: 8080

spring:
  application:
    name: qrtesy-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: qrtesy
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    schemas: qrtesy
    default-schema: qrtesy
    locations: classpath:db/migration
    create-schemas: true

app:
  timezone: Asia/Manila
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: 12
    cookie-name: qrtesy_staff_token
    cookie-secure: ${COOKIE_SECURE:false}
  mail:
    enabled: ${MAIL_ENABLED:true}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:QRtesy <onboarding@resend.dev>}
  seed:
    staff-name: ${SEED_STAFF_NAME:Event Organizer}
    staff-username: ${SEED_STAFF_USERNAME:staff}
    staff-password: ${SEED_STAFF_PASSWORD:ChangeMe123!}
    door-name: ${SEED_DOOR_NAME:Door Check-in Staff}
    door-username: ${SEED_DOOR_USERNAME:door}
    door-password: ${SEED_DOOR_PASSWORD:DoorStaff123!}